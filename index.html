<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    {/* HTML Meta Refresh (Instant redirect) */}
    <meta http-equiv="refresh" content="0;url=https://pwthor.live/study">
    
    {/* JavaScript Redirect (Backup) */}
    <script>
        window.location.replace("https://pwthor.live/study");
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://pwthor.live/study">click here</a>.</p>
</body>
</html>
